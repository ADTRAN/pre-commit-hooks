name: main

on:
  push:
    branches: [main, test-me-*, adtran]
    tags: '*'
  pull_request:

jobs:
  main-windows:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.8.1
    with:
      env: '["py39"]'
      os: windows-latest
  # No single version of tox.yml supports py39 through py314, and
  # ubuntu-latest has no Python 3.9
  main-linux-py39:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.8.1
    with:
      env: '["py39"]'
      os: ubuntu-24.04
  main-linux:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.12.0
    with:
      env: '["py310", "py311", "py312", "py313", "py314"]'
      os: ubuntu-latest
