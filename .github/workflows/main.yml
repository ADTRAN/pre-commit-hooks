name: main

on:
  push:
    branches: [main, test-me-*, adtran]
    tags: '*'
  pull_request:

jobs:
  main-windows:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.8.1
    with:
      env: '["py39"]'
      os: windows-latest
  main-linux:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.8.1
    with:
      env: '["py39", "py310", "py311", "py312"]'
      os: ubuntu-latest
  # No single version of tox.yml supports py39 through py314
  main-linux-new:
    uses: asottile/workflows/.github/workflows/tox.yml@v1.12.0
    with:
      env: '["py313", "py314"]'
      os: ubuntu-latest
